  ### 2.Auth server
  auth-server:
    image: ${MyTelegramRegistry}/mytelegram-auth-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default}
      App__DatabaseName: ${App__DatabaseName}
      App__ReadModelDatabaseName: ${App__ReadModelDatabaseName}
      App__AccessHashSecretKey: ${App__AccessHashSecretKey}
      App__DcOptions__0__IpAddress: ${App__DcOptions__0__IpAddress}
      App__DcOptions__0__Port: ${App__DcOptions__0__Port}
      App__EncryptionConfig__Enabled: ${App__EncryptionConfig__Enabled}
      App__EncryptionConfig__MessageKeys__0__Id: ${App__EncryptionConfig__MessageKeys__0__Id}
      App__EncryptionConfig__MessageKeys__0__Key: ${App__EncryptionConfig__MessageKeys__0__Key}
      App__EncryptionConfig__IndexKeys__0__Id: ${App__EncryptionConfig__IndexKeys__0__Id}
      App__EncryptionConfig__IndexKeys__0__Key: ${App__EncryptionConfig__IndexKeys__0__Key}
      RabbitMQ__Connections__Default__HostName: ${RabbitMQ__Connections__Default__HostName:-rabbitmq}
      RabbitMQ__Connections__Default__Port: ${RabbitMQ__Connections__Default__Port:-5672}
      RabbitMQ__Connections__Default__UserName: ${RabbitMQ__Connections__Default__UserName:-test}
      RabbitMQ__Connections__Default__Password: ${RabbitMQ__Connections__Default__Password}
      RabbitMQ__EventBus__ExchangeName: ${RabbitMQ__EventBus__ExchangeName}
      App__PrivateKeyFilePath: private.pkcs8.key
      Redis__Configuration: ${Redis__Configuration}
    volumes:
      - ./data/mytelegram/auth/logs:/app/Logs
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ### 3.Session server
  session-server:
    image: ${MyTelegramRegistry}/mytelegram-session-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      # App__ThisDcId: ${App__ThisDcId}
      # App__MediaOnly: ${App__MediaOnly}
      App__DatabaseName: ${App__DatabaseName}
      App__ReadModelDatabaseName: ${App__ReadModelDatabaseName}
      App__AccessHashSecretKey: ${App__AccessHashSecretKey}
      # App__IdGeneratorGrpcServiceUrl: ${App__IdGeneratorGrpcServiceUrl}
      # App__MessengerServerGrpcServiceUrl: ${App__MessengerServerGrpcServiceUrl}
      # App__DispatchUnknownObjectToMessengerServer: ${App__DispatchUnknownObjectToMessengerServer}
      # Must not be shorter than the client's own temp-key lifetime. Android binds a temp auth
      # key with expires_at = now + TEMP_AUTH_KEY_EXPIRE_TIME (24 h, tgnet/Defines.h) and only
      # drops it on a -404, so with the server default of 720 min a client that stays offline
      # overnight comes back with a key the server swept out of its cache and every request is
      # answered with -404 until the handshake is redone. 1500 min = 25 h leaves an hour of
      # margin so the client always rotates the key before the server forgets it.
      App__TempAuthKeyExpirationMinutes: ${App__TempAuthKeyExpirationMinutes:-1500}
      # App__CommandServerObjectIds: ${App__CommandServerObjectIds}
      # Route RTMP/group-call stream RPCs arriving on media auth keys through the
      # sticker/media lane; query-server converts them back to messenger queries.
      App__StickerServerObjectIds__0: "447879488" # phone.getGroupCallStreamChannels
      App__StickerServerObjectIds__1: "1525991226" # phone.getGroupCallStreamRtmpUrl
      App__StickerServerObjectIds__2: "3193124286" # upload.getFile inputGroupCallStream
      RabbitMQ__Connections__Default__HostName: ${RabbitMQ__Connections__Default__HostName:-rabbitmq}
      RabbitMQ__Connections__Default__Port: ${RabbitMQ__Connections__Default__Port:-5672}
      RabbitMQ__Connections__Default__UserName: ${RabbitMQ__Connections__Default__UserName:-test}
      RabbitMQ__Connections__Default__Password: ${RabbitMQ__Connections__Default__Password}
      #RabbitMQ__EventBus__ClientName: ${RabbitMQ__EventBus__ClientName}
      RabbitMQ__EventBus__ExchangeName: ${RabbitMQ__EventBus__ExchangeName}
      Redis__Configuration: ${Redis__Configuration}
    volumes:
      - ./data/mytelegram/session/logs:/app/Logs
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

