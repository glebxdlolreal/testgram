  ### 6.Messenger query server
  messenger-query-server:
    image: ${MyTelegramRegistry}/mytelegram-messenger-query-server:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      App__DatabaseName: ${App__DatabaseName}
      App__ReadModelDatabaseName: ${App__ReadModelDatabaseName}
      App__AccessHashSecretKey: ${App__AccessHashSecretKey}
      App__FileServerGrpcServiceUrl: ${App__FileServerGrpcServiceUrl}
      # file_reference lifetime and enforcement, see https://corefork.telegram.org/api/file-references
      App__FileReferences__Mode: ${App__FileReferences__Mode:-LogOnly}
      App__FileReferences__TtlHours: ${App__FileReferences__TtlHours:-48}
      # account.saveRingtone converts a sound that is not MP3 with ffmpeg and stores the twin in the
      # same MinIO bucket the file server reads from; without these it fails with 403
      # InvalidAccessKeyId and the sound is saved unconverted. Which of the two messenger queues serves
      # the ringtone methods is decided by the session-server, so both need the credentials.
      # See https://corefork.telegram.org/api/ringtones
      Minio__Endpoint: ${Minio__Endpoint:-minio:9000}
      Minio__AccessKey: ${Minio__AccessKey}
      Minio__SecretKey: ${Minio__SecretKey}
      Minio__BucketName: ${Minio__BucketName:-tg-files}
      # messages.transcribeAudio may be served by either messenger queue, so this one also needs the
      # recognition settings - it queues the work and the command server's worker performs it.
      # See https://corefork.telegram.org/api/transcribe
      App__Transcription__Enabled: ${App__Transcription__Enabled:-True}
      App__Transcription__Provider: ${App__Transcription__Provider:-Deepgram}
      App__Transcription__BaseUrl: ${App__Transcription__BaseUrl:-https://api.deepgram.com/v1}
      App__Transcription__ApiKey: ${App__Transcription__ApiKey}
      App__Transcription__Model: ${App__Transcription__Model:-nova-3}
      App__Transcription__DetectLanguage: ${App__Transcription__DetectLanguage:-True}
      App__Transcription__SmartFormat: ${App__Transcription__SmartFormat:-True}
      App__Transcription__TimeoutSeconds: ${App__Transcription__TimeoutSeconds:-120}
      App__Transcription__MaxDurationSeconds: ${App__Transcription__MaxDurationSeconds:-0}
      App__Translation__Enabled: ${App__Translation__Enabled:-True}
      App__Translation__Provider: ${App__Translation__Provider:-DeepL}
      App__Translation__BaseUrl: ${App__Translation__BaseUrl:-https://api-free.deepl.com/v2}
      App__Translation__ApiKey: ${App__Translation__ApiKey}
      App__Translation__PreserveEntities: ${App__Translation__PreserveEntities:-True}
      App__Translation__TimeoutSeconds: ${App__Translation__TimeoutSeconds:-20}
      App__Translation__CacheDays: ${App__Translation__CacheDays:-30}
      App__Translation__MaxMessagesPerRequest: ${App__Translation__MaxMessagesPerRequest:-20}
      App__Translation__MaxCharactersPerRequest: ${App__Translation__MaxCharactersPerRequest:-25000}
      App__FixedVerifyCode: ${App__FixedVerifyCode}
      App__VerificationCodeLength: ${App__VerificationCodeLength}
      App__VerificationCodeExpirationSeconds: ${App__VerificationCodeExpirationSeconds}
      App__EnableSearchNonContacts: ${App__EnableSearchNonContacts}
      App__EncryptionConfig__Enabled: ${App__EncryptionConfig__Enabled}
      App__EncryptionConfig__MessageKeys__0__Id: ${App__EncryptionConfig__MessageKeys__0__Id}
      App__EncryptionConfig__MessageKeys__0__Key: ${App__EncryptionConfig__MessageKeys__0__Key}
      App__EncryptionConfig__IndexKeys__0__Id: ${App__EncryptionConfig__IndexKeys__0__Id}
      App__EncryptionConfig__IndexKeys__0__Key: ${App__EncryptionConfig__IndexKeys__0__Key}
      # App__JoinChatDomain: ${App__JoinChatDomain}
      # App__ChannelGetDifferenceIntervalSeconds: ${App__ChannelGetDifferenceIntervalSeconds}
      # App__UseInMemoryFilters: ${App__UseInMemoryFilters}
      # App__IsMediaDc: ${App__IsMediaDc}
      # App__AutoCreateSuperGroup: ${App__AutoCreateSuperGroup}
      # App__EnableFutureAuthToken: ${App__EnableFutureAuthToken}
      # App__SetPremiumToTrueAfterUserCreated: ${App__SetPremiumToTrueAfterUserCreated}
      # App__SendWelcomeMessageAfterUserSignIn: ${App__SendWelcomeMessageAfterUserSignIn}
      App__WebRtcConnections__0__Ip: ${App__WebRtcConnections__0__Ip}
      App__WebRtcConnections__0__Port: ${App__WebRtcConnections__0__Port}
      App__WebRtcConnections__0__Turn: ${App__WebRtcConnections__0__Turn}
      App__WebRtcConnections__0__Stun: ${App__WebRtcConnections__0__Stun}
      App__WebRtcConnections__0__UserName: ${App__WebRtcConnections__0__UserName}
      App__WebRtcConnections__0__Password: ${App__WebRtcConnections__0__Password}
      App__WebRtcConnections__0__AuthSecret: ${App__WebRtcConnections__0__AuthSecret}
      App__RtmpStreamUrl: ${App__RtmpStreamUrl}
      App__RtmpHlsUrl: ${App__RtmpHlsUrl}
      App__PasskeyRpId: ${App__PasskeyRpId}
      App__PasskeyRpName: ${App__PasskeyRpName}
      App__Stripe__PublishableKey: ${App__Stripe__PublishableKey}
      App__Stripe__SecretKey: ${App__Stripe__SecretKey}
      # Telegram Premium prices are in this currency; the terms default to PremiumOptions.DefaultPeriods.
      Premium__Currency: ${Premium__Currency:-RUB}
      # Speed cap for accounts without Premium: past it file parts get 420 FLOOD_PREMIUM_WAIT_X.
      # Enforced in the file lane router, see https://corefork.telegram.org/api/files
      Premium__SpeedLimit__Enabled: ${Premium__SpeedLimit__Enabled:-true}
      Premium__SpeedLimit__UploadBytesPerSecond: ${Premium__SpeedLimit__UploadBytesPerSecond:-1048576}
      Premium__SpeedLimit__DownloadBytesPerSecond: ${Premium__SpeedLimit__DownloadBytesPerSecond:-1048576}
      Premium__SpeedLimit__BurstBytes: ${Premium__SpeedLimit__BurstBytes:-536870912}
      EmailSenderOptions__Enabled: ${EmailSenderOptions__Enabled}
      EmailSenderOptions__FromAddress: ${EmailSenderOptions__FromAddress}
      EmailSenderOptions__FromDisplayName: ${EmailSenderOptions__FromDisplayName}
      EmailSenderOptions__SmtpEmailOptions__Host: ${EmailSenderOptions__SmtpEmailOptions__Host}
      EmailSenderOptions__SmtpEmailOptions__Port: ${EmailSenderOptions__SmtpEmailOptions__Port}
      EmailSenderOptions__SmtpEmailOptions__UserName: ${EmailSenderOptions__SmtpEmailOptions__UserName}
      EmailSenderOptions__SmtpEmailOptions__Password: ${EmailSenderOptions__SmtpEmailOptions__Password}
      EmailSenderOptions__SmtpEmailOptions__EnableSsl: ${EmailSenderOptions__SmtpEmailOptions__EnableSsl}
      # App__ThisDcId: ${App__ThisDcId}
      # Full datacenter list advertised to clients via help.getConfig. Every DC the official
      # client knows about (1-5) MUST be listed here and point at THIS server, otherwise the
      # client falls back to its built-in (foreign) address for any missing DC - e.g. DC4 ->
      # 194.221.250.50 - whose RSA key it doesn't have ("could not choose public RSA key").
      # Ports must be live TCP MTProto listeners on the gateway (20543/20643/20644);
      # 20443 is not listened and 30443/30444 are HTTPS (web) endpoints.
      App__DcOptions__0__Enabled: "True"
      App__DcOptions__0__Id: "1"
      App__DcOptions__0__IpAddress: ${App__DcOptions__0__IpAddress}
      App__DcOptions__0__Port: "20543"
      App__DcOptions__0__MediaOnly: "False"

      App__DcOptions__1__Enabled: "True"
      App__DcOptions__1__Id: "2"
      App__DcOptions__1__IpAddress: ${App__DcOptions__1__IpAddress}
      App__DcOptions__1__Port: "20644"
      App__DcOptions__1__MediaOnly: "False"

      App__DcOptions__2__Enabled: "True"
      App__DcOptions__2__Id: "3"
      App__DcOptions__2__IpAddress: ${App__DcOptions__2__IpAddress}
      App__DcOptions__2__Port: "20643"
      App__DcOptions__2__MediaOnly: "False"

      App__DcOptions__3__Enabled: "True"
      App__DcOptions__3__Id: "4"
      App__DcOptions__3__IpAddress: ${App__DcOptions__3__IpAddress}
      App__DcOptions__3__Port: "20644"
      App__DcOptions__3__MediaOnly: "False"

      App__DcOptions__4__Enabled: "True"
      App__DcOptions__4__Id: "5"
      App__DcOptions__4__IpAddress: ${App__DcOptions__0__IpAddress}
      App__DcOptions__4__Port: "20543"
      App__DcOptions__4__MediaOnly: "False"
      RabbitMQ__Connections__Default__HostName: ${RabbitMQ__Connections__Default__HostName:-rabbitmq}
      RabbitMQ__Connections__Default__Port: ${RabbitMQ__Connections__Default__Port:-5672}
      RabbitMQ__Connections__Default__UserName: ${RabbitMQ__Connections__Default__UserName:-test}
      RabbitMQ__Connections__Default__Password: ${RabbitMQ__Connections__Default__Password}
      RabbitMQ__EventBus__ClientName: MyTelegramMessengerQueryServer
      RabbitMQ__EventBus__ExchangeName: ${RabbitMQ__EventBus__ExchangeName}
      Redis__Configuration: ${Redis__Configuration}
      MYTELEGRAM_GEOIP_COUNTRY_DB: ${MYTELEGRAM_GEOIP_COUNTRY_DB:-/geoip/GeoLite2-City.mmdb}
    volumes:
      - ./data/mytelegram/query-server/logs:/app/Logs
      - /var/www/html/update.json:/app/update.json:ro
      - ./geoip:/geoip:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ### 7.Sms sender
  sms-sender:
    image: ${MyTelegramRegistry}/mytelegram-sms-sender:${MyTelegramVersion}
    restart: always
    networks:
      - tg-net
    environment:
      Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default}
      TwilioSms__Enabled: ${TwilioSms__Enabled}
      TwilioSms__AccountSId: ${TwilioSms__AccountSId}
      TwilioSms__AuthToken: ${TwilioSms__AuthToken}
      TwilioSms__FromNumber: ${TwilioSms__FromNumber}
      TwilioSms__MessagingServiceSId: ${TwilioSms__MessagingServiceSId}
      # VonageSms__Enabled: ${VonageSms__Enabled}
      # VonageSms__BrandName: ${VonageSms__BrandName}
      # VonageSms__ApiKey: ${VonageSms__ApiKey}
      # VonageSms__ApiSecret: ${VonageSms__ApiSecret}
      RabbitMQ__Connections__Default__HostName: ${RabbitMQ__Connections__Default__HostName:-rabbitmq}
      RabbitMQ__Connections__Default__Port: ${RabbitMQ__Connections__Default__Port:-5672}
      RabbitMQ__Connections__Default__UserName: ${RabbitMQ__Connections__Default__UserName:-test}
      RabbitMQ__Connections__Default__Password: ${RabbitMQ__Connections__Default__Password}
      #RabbitMQ__EventBus__ClientName: ${RabbitMQ__EventBus__ClientName}
      RabbitMQ__EventBus__ExchangeName: ${RabbitMQ__EventBus__ExchangeName}
      TelegramBotSms__Enabled: "true"
      # The code goes to the delivery bot through a durable RabbitMQ queue. It used to be an HTTP POST to
      # a port the bot opened, addressed at a docker bridge IP that does not exist on this host: every
      # code then sat in HttpClient for its full 100s timeout, and the open port let anyone send a code
      # to any linked number.
      TelegramBotSms__ExchangeName: ${TelegramBotSms__ExchangeName:-telegram-bot-codes}
      TelegramBotSms__QueueName: ${TelegramBotSms__QueueName:-telegram-bot-codes}
      TelegramBotSms__RoutingKey: ${TelegramBotSms__RoutingKey:-code}
    volumes:
      - ./data/mytelegram/sms-sender/logs:/app/Logs
    depends_on:
      rabbitmq:
        condition: service_healthy

configs:
  minio_proxy_conf:
    content: |
      worker_processes auto;
      events { worker_connections 1024; }

      http {
          access_log off;

          server {
              listen 9000;

              # Let large object uploads stream straight through untouched.
              client_max_body_size 0;
              ignore_invalid_headers off;
              proxy_buffering off;
              proxy_request_buffering off;

              # Resolve the MinIO container name at runtime via Docker's DNS so the
              # proxy keeps working if MinIO is recreated with a new IP.
              resolver 127.0.0.11 valid=30s ipv6=off;
              set $$minio_backend "minio:9000";

              location / {
                  proxy_pass http://$$minio_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$http_host;
                  proxy_set_header Connection "";
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;

                  # WHY THIS PROXY EXISTS:
                  # The MinIO .NET SDK bundled in the upstream mytelegram-file-server image
                  # (Minio 6.0.6-local, commit 0b39839) has a regression: when MinIO answers
                  # a byte-range request with "416 Range Not Satisfiable" (no body) it runs
                  # ParseWellKnownErrorNoContent, which does not handle 416, leaves the error
                  # object null, and then `throw error;` becomes a NullReferenceException.
                  # Telegram clients issue such an out-of-range request for the final chunk of
                  # a download (offset at/after EOF), so the file-server log gets spammed with
                  # NullReferenceException and those tail requests fail.
                  # We can't rebuild file-server here (it is published separately), so we
                  # neutralise the 416 at the proxy: turn it into a clean empty 200 that the
                  # SDK handles without crashing. Only 416 responses are rewritten; everything
                  # else (200/206/normal errors) passes through unchanged.
                  proxy_intercept_errors on;
                  error_page 416 = @range_not_satisfiable;
              }

              location @range_not_satisfiable {
                  internal;
                  add_header Accept-Ranges bytes always;
                  return 200 "";
              }
          }
      }
